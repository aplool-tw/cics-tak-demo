# dev-launcher.conf — Example configuration for scripts/dev-launcher.sh
#
# Copy this file to scripts/dev-launcher.conf (git-ignored) and edit to match
# your local environment. All variables are optional; defaults are shown.
#
# Usage:
#   scripts/dev-launcher.sh --config scripts/dev-launcher.conf
#   scripts/dev-launcher.sh --config scripts/dev-launcher.conf --services cot-gateway,tak-client-sim
#
# CLI flags always override values set here. Values here override the built-in
# defaults in dev-launcher.sh.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
# Host that all services bind their listen sockets to.
BIND_HOST="127.0.0.1"

# Individual service ports
UDS_PORT="8080"
MAP_SIM_PORT="8090"
ECHOSHIELD_PORT="9000"
SENTRYCS_PORT="7070"

# TAK Server (external; not started by this launcher)
TAK_HOST="127.0.0.1"
TAK_PORT="8089"

# Set to "true" to enable SSL on the CoT Gateway → TAK Server uplink.
# Requires gateway.p12 (see TAK_CERT_DIR below).
TAK_USE_SSL="false"

# Directory containing gateway.p12 and (optional) truststore.pem.
# Default when TAK_USE_SSL=true: <repo>/infra/certs
# TAK_CERT_DIR="/path/to/certs"

# Password for gateway.p12. Falls back to $TAK_P12_PASSWORD env var, then "takpoc".
# TAK_P12_PASSWORD_OVERRIDE="takpoc"

# ---------------------------------------------------------------------------
# Upstream URL overrides
# (default: derived from BIND_HOST + the port variables above)
# ---------------------------------------------------------------------------
# UDS_MAP_SIM_URL="http://127.0.0.1:8090"
# ECHOSHIELD_MAP_SIM_URL="http://127.0.0.1:8090"
# SENTRYCS_MAP_SIM_URL="http://127.0.0.1:8090"
# SENTRYCS_UDS_URL="http://127.0.0.1:8080"

# CoT Gateway connection targets (default: derived from BIND_HOST + port vars)
# GATEWAY_ECHOSHIELD_HOST="127.0.0.1"
# GATEWAY_ECHOSHIELD_PORT="9000"
# GATEWAY_SENTRYCS_HOST="127.0.0.1"
# GATEWAY_SENTRYCS_PORT="7070"
# GATEWAY_TAK_HOST="127.0.0.1"
# GATEWAY_TAK_PORT="8089"

# ---------------------------------------------------------------------------
# TAK Client Simulator
# ---------------------------------------------------------------------------
# Filter console output to only CoT events whose UID starts with this prefix.
# Empty = show all. Examples: "FUSED", "ECHO", "SENTRYCS"
TAK_CLIENT_SIM_FILTER=""

# ---------------------------------------------------------------------------
# Scenarios
# ---------------------------------------------------------------------------
# UDS_SCENARIO="/path/to/single_drone_invasion.yaml"
# SENTRYCS_SCENARIO="/path/to/sentrycs-sim/config/local.yaml"

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
# Pass --verbose to all services for DEBUG-level logging.
# VERBOSE_FLAG="--verbose"

# Keep .dev-runtime/ (logs + pid files) after shutdown.
KEEP_RUNTIME="false"
