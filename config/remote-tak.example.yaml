# remote-tak.example.yaml — Remote TAK server configuration TEMPLATE.
#
# This is an annotated example. Copy it to config/remote-tak.yaml and fill in
# your actual values, OR run the interactive wizard:
#
#   bash scripts/setup-remote-tak.sh
#
# The wizard guides you step by step and writes config/remote-tak.yaml for you.
#
# --- HOW REMOTE MODE WORKS ---
# • If config/remote-tak.yaml exists AND tak_server.host is NOT 127.0.0.1 /
#   localhost, the demo scripts (demo-1drone-remote-tak.sh and
#   demo-3drone-remote-tak.sh) automatically switch to REMOTE MODE:
#     - tak-relay is NOT started locally
#     - cot-gateway connects directly to your TAK server
#     - tak-client-sim connects to your TAK server as a monitoring client
# • If the file is absent or host is localhost, LOCAL MODE is used (tak-relay
#   started locally — no external connectivity required).
#
# Operator quick-start:
#   1. Copy this file:  cp config/remote-tak.example.yaml config/remote-tak.yaml
#   2. Edit host/port/cert settings below
#   3. Place your P12 client certificate at config/certs/gateway.p12
#   4. (Optional) Place CA bundle PEM at config/certs/ca-bundle.pem
#   5. Run: scripts/demo-1drone-remote-tak.sh

tak_server:
  # TAK server IP address or hostname (required for remote mode)
  host: "192.168.1.100"

  # TAK server TCP port (default: 8089 for SSL, 8087 for plain TCP)
  port: 8089

  # Enable TLS/SSL for the connection (recommended: true)
  use_ssl: true

  # Verify the TAK server's TLS certificate against ca_bundle (set false for self-signed certs)
  use_ssl_verify: false

  # Path to client P12 certificate for mutual TLS (relative to repo root)
  # Place your P12 client certificate at config/certs/gateway.p12
  cert_file: "config/certs/gateway.p12"

  # Password for the P12 certificate (null if unencrypted or no client cert required)
  cert_password: null

  # Path to CA bundle PEM for server cert verification (null to use system trust store)
  # Place your CA bundle PEM at config/certs/ca-bundle.pem (if use_ssl_verify: true)
  ca_bundle: null

  # Include XML declaration in CoT messages (<?xml version="1.0"?>)
  xml_declaration: true

  # Maximum retry attempts before giving up (0 = unlimited)
  max_retries: 10

  # Initial exponential backoff delay in seconds
  backoff_initial_s: 2.0

  # Maximum backoff cap in seconds
  backoff_cap_s: 60.0

  # Maximum CoT messages queued before dropping oldest
  queue_maxsize: 500
