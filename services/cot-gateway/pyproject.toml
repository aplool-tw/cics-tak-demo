[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cot-gateway"
version = "0.1.0"
description = "CoT Gateway — fuse EchoShield + Sentrycs tracks into CoT 2.0 XML for TAK Server"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.6",
    "structlog>=24.1",
    "pyyaml",
    "cryptography",
    "tak-connection @ file:///home/longtai/works/cics/cics-tak-demo/libs/tak-connection",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
    "ruff>=0.4",
    "black>=24.3",
]

[project.scripts]
cot-gateway = "cot_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
