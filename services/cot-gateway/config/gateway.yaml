echoshield:
  host: echoshield-sim
  port: 9000
  reconnect_interval_s: 5.0

sentrycs:
  enabled: true
  host: sentrycs-sim
  port: 7070
  poll_interval_s: 1.0
  timeout_s: 2.0

correlator:
  distance_threshold_m: 50.0
  time_window_s: 3.0
  ttl_s: 10.0

tak_server:
  host: tak-server
  port: 8089
  use_ssl: true
  use_ssl_verify: false
  cert_file: config/certs/gateway.p12
  cert_password: "${TAK_P12_PASSWORD}"
  max_retries: 5
  backoff_initial_s: 1.0
  backoff_cap_s: 60.0
  queue_maxsize: 500

logging:
  level: INFO
  json: true

broadcast:
  enabled: false
  # SP and HP coordinates (defaults match Taiwan PoC site)
  sp_lat: 24.725806
  sp_lon: 121.033750
  sp_alt_m: 50.0
  sp_name: "Strategic Point"
  hp_lat: 24.735344
  hp_lon: 121.044252
  hp_alt_m: 0.0
  hp_name: "Holding Point"
  defense_rings_m: [1000, 2000, 3000]
  interval_s: 30.0
