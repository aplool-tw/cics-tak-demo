# CoT Gateway demo config — local dev, web map enabled, no TAK SSL cert required.
# TAK server connection will retry indefinitely (max_retries: 9999) so the gateway
# keeps running even without a real TAK server — use the web map viewer instead.

echoshield:
  host: 127.0.0.1
  port: 19000
  reconnect_interval_s: 5.0

sentrycs:
  enabled: true
  host: 127.0.0.1
  port: 17070
  poll_interval_s: 1.0
  timeout_s: 2.0

correlator:
  # distance_threshold_m must be > (drone_speed × max_polling_lag + sensor_noise)
  # Demo: 35m/s × 1.5s + 5m noise = 57.5m → use 150m for a safe margin.
  distance_threshold_m: 150.0
  time_window_s: 3.0
  ttl_s: 30.0

tak_server:
  host: 127.0.0.1
  port: 18089
  use_ssl: false
  use_ssl_verify: false
  cert_file: "config/certs/gateway.p12"  # not loaded (use_ssl: false)
  max_retries: 9999                       # retry indefinitely — don't kill gateway
  backoff_initial_s: 5.0
  backoff_cap_s: 60.0
  queue_maxsize: 500

logging:
  level: INFO
  json: true

web:
  enabled: true
  host: 0.0.0.0
  port: 18092
  sites_file: "config/sites.yaml"
  echoshield_info_url: "http://127.0.0.1:19001/info"
  sentrycs_sensor_url: "http://127.0.0.1:17070/sensor-info"
  sp_lat: 24.725806
  sp_lon: 121.033750

perimeter:
  enabled: true
  uds_url: "http://127.0.0.1:18080"
  radius_m: 1000.0
  holding_lat: 24.735344
  holding_lon: 121.044252
  holding_alt_m: 50.0
  descent_speed_ms: 15.0


broadcast:
  enabled: true
  sp_lat: 24.725806
  sp_lon: 121.033750
  sp_alt_m: 50.0
  sp_name: "Strategic Point"
  hp_lat: 24.735344
  hp_lon: 121.044252
  hp_alt_m: 0.0
  hp_name: "Holding Point"
  defense_rings_m: [1000, 2000, 3000]
  interval_s: 30.0
