# CoT Gateway — Remote TAK Server configuration template
# Use this config to connect to a real TAK server (FreeTAKServer, TAK Server CE, WinTAK, ATAK).
#
# Usage:
#   python3 -m cot_gateway --config config/remote-tak.yaml [--tak-host HOST] [--tak-port PORT]
#
# Certificate placement:
#   - Place your P12 client certificate at config/certs/gateway.p12
#   - Place your CA bundle PEM at config/certs/ca-bundle.pem (if using CA-verified TLS)
#   - Run scripts/gen-certs.sh to generate a self-signed cert for testing

echoshield:
  host: "${ECHO_HOST:-127.0.0.1}"
  port: 9000
  reconnect_interval_s: 5.0

sentrycs:
  enabled: true
  host: "${SENTRYCS_HOST:-127.0.0.1}"
  port: 7070
  poll_interval_s: 1.0
  timeout_s: 2.0

correlator:
  distance_threshold_m: 150.0
  time_window_s: 3.0
  ttl_s: 30.0

tak_server:
  host: "${TAK_HOST}"           # REQUIRED: set to your TAK server IP or hostname
  port: 8089                    # Default TAK server CoT TCP port
  use_ssl: true                 # Enable mutual TLS for real TAK server connections
  use_ssl_verify: false         # Set true + ca_bundle for CA-verified TLS (production)
  cert_file: "config/certs/gateway.p12"   # P12 client certificate (obtained from TAK server admin)
  cert_password: "${TAK_CERT_PASSWORD}"   # P12 password (or blank if no password)
  ca_bundle: null               # Set to "config/certs/ca-bundle.pem" if use_ssl_verify: true
  xml_declaration: true         # Real TAK servers (ATAK/WinTAK) expect XML declaration header
  max_retries: 10
  backoff_initial_s: 2.0
  backoff_cap_s: 60.0
  queue_maxsize: 500

logging:
  level: INFO
  json: true

web:
  enabled: false   # Disable web map when connecting to real TAK server (optional)
  host: 0.0.0.0
  port: 8092
  sites_file: ""
  echoshield_info_url: "http://127.0.0.1:9001/info"
  sentrycs_sensor_url: "http://127.0.0.1:7070/sensor-info"

broadcast:
  enabled: false
  sp_lat: 24.725806
  sp_lon: 121.033750
  sp_alt_m: 50.0
  sp_name: "Strategic Point"
  hp_lat: 24.735344
  hp_lon: 121.044252
  hp_alt_m: 0.0
  hp_name: "Holding Point"
  defense_rings_m: [1000, 2000, 3000]
  interval_s: 30.0
