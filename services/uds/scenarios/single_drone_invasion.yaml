scenario:
  name: "single_drone_invasion"
  description: "單架 DJI Mavic 3 從北方入侵，Sentrycs 識別並接管"
  update_hz: 10
  servers:
    command_api_port: 8080

  drones:
    - drone_id: "TRK-001"
      model: "DJI Mavic 3"
      start_lat: 25.0598
      start_lon: 121.5654
      start_alt_m: 120.0
      speed_ms: 15.0
      heading_deg: 180.0
      operator_bearing_deg: 225
      operator_distance_m: 300
      waypoints:
        - { lat: 25.0330, lon: 121.5654, alt_m: 100.0 }
      landing_point:
        lat: 25.0250
        lon: 121.5654
        alt_m: 0.0
        descent_speed_ms: 3.0

  timeline:
    - at_s: 0
      action: start_flying
      drone_id: "TRK-001"
