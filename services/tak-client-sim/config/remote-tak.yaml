# TAK Client Sim — Remote TAK Server configuration template
# Connect tak-client-sim to a real TAK server to receive and display CoT tracks.
#
# ⚠️ Log format vs wire format:
#   Service logs are JSON (structlog) written to stderr.
#   The wire protocol received from TAK Server is CoT XML.
#   These are independent formats — do not confuse them.
#
# Usage:
#   python3 -m tak_client_sim --config config/remote-tak.yaml

host: "${TAK_HOST}"      # REQUIRED: set to your TAK server IP or hostname
port: 8089               # Default TAK server CoT TCP port
use_ssl: true            # Enable SSL/TLS for real TAK server
use_ssl_verify: false    # Set true + ca_bundle for CA-verified TLS (production)
ca_bundle: null          # Set to "certs/ca-bundle.pem" if use_ssl_verify: true
max_retries: 0           # 0 = unlimited retries

web_enabled: true        # Enable web map to display received tracks
web_host: 0.0.0.0
web_port: 8093

# Logging: output goes to stderr as structured JSON (structlog).
# The bytes received on the TCP socket are CoT XML — a separate format.
